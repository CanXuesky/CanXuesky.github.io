name: Build and deploy al-folio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler: '2.6.9'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build static site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Verify exported pages and assets
        run: node --test tests/static-export.test.mjs
      - name: Audit template overrides
        run: bundle exec al-folio upgrade overrides audit --fail-on-stale
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
